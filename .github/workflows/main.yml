name: Build Native Camera Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          GRADLE_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Android project files not found! Upload the extracted ZIP files to the Code tab first."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativeCameraPro-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
